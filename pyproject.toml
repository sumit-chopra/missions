[project]
name = "missions"
version = "0.1.0"
description = "Conversational LLM mission assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "structlog>=24",

]

[project.optional-dependencies]
vault = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.2",
    "langchain-community>=0.4.2",
    "langchain-classic>=1.0.8",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.21",
]

chat = [
    "openai>=3.5.0",
]

# Glass Cockpit "with teeth": the chat REPL plus a save_memory tool, built on
# the OpenAI Agents SDK.
chat-teeth = [
    "openai>=3.5.0",
    "openai-agents>=0.22",
]

copilot = [
    "openai>=3.5.0",
    "openai-agents>=0.22",
    # policy_lookup delegates to the Mission 2 retrieval service (Rag).
    "missions[vault]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Pre-built Mission 3 candidate-pack mocks — kept verbatim, "do not modify".
extend-exclude = ["src/missions/co_pilot/tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
