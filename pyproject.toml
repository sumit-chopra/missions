[project]
name = "missions"
version = "0.1.0"
description = "Conversational LLM mission assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "structlog>=24",

]

[project.optional-dependencies]
vault = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.2",
    "langchain-community>=0.4.2",
]

chat = [
    "openai>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
